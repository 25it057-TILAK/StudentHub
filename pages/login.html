<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - StudentHub</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body class="auth-page">


<div class="auth-container">

    <div class="auth-brand">

        <img src="../images/logo.png" alt="StudentHub Logo">

        <h1>Student<span>Hub</span></h1>

        <p>
            Your digital student community.
        </p>

    </div>


    <div class="auth-card">

        <p class="section-label">WELCOME BACK</p>

        <h2>Login to StudentHub</h2>

        <p class="auth-description">
            Enter your account details to continue.
        </p>


        <form>

            <div class="form-group">

                <label>Email Address</label>

                <input
                    type="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label>Password</label>

                <input
                    type="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <div class="form-options">

                <label>
                    <input type="checkbox">
                    Remember me
                </label>

                <a href="#">Forgot Password?</a>

            </div>


            <button
                type="submit"
                class="btn-primary auth-btn"
            >
                Login
            </button>

        </form>


        <div class="auth-divider">
            <span>OR</span>
        </div>


        <p class="auth-bottom">
            Don't have an account?
            <a href="register.html">Create Account</a>
        </p>

    </div>

</div>

</body>
</html>
