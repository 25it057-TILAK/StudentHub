<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - StudentHub</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body class="auth-page">


<div class="auth-container register-container">

    <div class="auth-brand">

        <img src="../images/logo.png" alt="StudentHub Logo">

        <h1>Student<span>Hub</span></h1>

        <p>
            Join your digital student community.
        </p>

    </div>


    <div class="auth-card">

        <p class="section-label">GET STARTED</p>

        <h2>Create Your Account</h2>

        <p class="auth-description">
            Join StudentHub and explore student opportunities.
        </p>


        <form>

            <div class="form-row">

                <div class="form-group">

                    <label>First Name</label>

                    <input
                        type="text"
                        placeholder="First name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>Last Name</label>

                    <input
                        type="text"
                        placeholder="Last name"
                        required
                    >

                </div>

            </div>


            <div class="form-group">

                <label>Email Address</label>

                <input
                    type="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label>Student ID</label>

                <input
                    type="text"
                    placeholder="Enter student ID"
                >

            </div>


            <div class="form-group">

                <label>Course</label>

                <select>

                    <option>Select your course</option>
                    <option>B.Tech Information Technology</option>
                    <option>B.Tech Computer Engineering</option>
                    <option>B.Tech Electronics</option>

                </select>

            </div>


            <div class="form-group">

                <label>Password</label>

                <input
                    type="password"
                    placeholder="Create password"
                    required
                >

            </div>


            <div class="form-group">

                <label>Confirm Password</label>

                <input
                    type="password"
                    placeholder="Confirm password"
                    required
                >

            </div>


            <label class="terms">

                <input type="checkbox" required>

                I agree to the StudentHub terms and conditions.

            </label>


            <button
                type="submit"
                class="btn-primary auth-btn"
            >
                Create Account
            </button>

        </form>


        <p class="auth-bottom">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </p>

    </div>

</div>

</body>
</html>
