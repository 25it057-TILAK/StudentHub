<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - StudentHub</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

<header class="header">

    <div class="logo">
        <img src="../images/logo.png" alt="StudentHub">
        <div class="logo-text">
            <span>Student</span><b>Hub</b>
        </div>
    </div>

    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="events.html">Events</a>
        <a href="contact.html" class="active">Contact</a>
        <a href="faq.html">FAQ</a>
    </nav>

    <a href="login.html" class="login-btn">Login</a>

</header>


<section class="page-hero">
    <p>GET IN TOUCH</p>
    <h1>Contact <span>StudentHub</span></h1>
    <span>We are here to help you.</span>
</section>


<section class="contact-section">

    <div class="contact-info">

        <div class="contact-card">
            <div class="contact-icon">📧</div>
            <h3>Email</h3>
            <p>studenthub@example.com</p>
        </div>

        <div class="contact-card">
            <div class="contact-icon">📍</div>
            <h3>Location</h3>
            <p>University Campus, Gujarat</p>
        </div>

        <div class="contact-card">
            <div class="contact-icon">📞</div>
            <h3>Phone</h3>
            <p>+91 98765 43210</p>
        </div>

    </div>


    <div class="form-card">

        <p class="section-label">CONTACT US</p>
        <h2>Send Us a Message</h2>

        <form>

            <div class="form-row">

                <div class="form-group">
                    <label>Your Name</label>
                    <input type="text" placeholder="Enter your name" required>
                </div>

                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" placeholder="Enter your email" required>
                </div>

            </div>

            <div class="form-group">
                <label>Subject</label>
                <input type="text" placeholder="Enter subject">
            </div>

            <div class="form-group">
                <label>Message</label>
                <textarea rows="6" placeholder="Write your message"></textarea>
            </div>

            <button type="submit" class="btn-primary">
                Send Message
            </button>

        </form>

    </div>

</section>

</body>
</html>
