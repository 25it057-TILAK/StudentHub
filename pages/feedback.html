<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback - StudentHub</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

<header class="header">

    <div class="logo">
        <img src="../images/logo.png" alt="StudentHub">
        <div class="logo-text">
            <span>Student</span><b>Hub</b>
        </div>
    </div>

    <nav>
        <a href="index.html">Home</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="events.html">Events</a>
        <a href="feedback.html" class="active">Feedback</a>
        <a href="profile.html">Profile</a>
    </nav>

    <a href="login.html" class="login-btn">Logout</a>

</header>


<section class="page-hero">

    <p>YOUR OPINION MATTERS</p>

    <h1>Share Your <span>Feedback</span></h1>

    <span>Help us make StudentHub better for everyone.</span>

</section>


<section class="feedback-section">

    <div class="form-card feedback-card">

        <div class="feedback-icon">
            💬
        </div>

        <h2>How was your experience?</h2>

        <p>
            Your feedback helps us improve our platform.
        </p>

        <form>

            <div class="form-group">

                <label>Your Name</label>

                <input
                    type="text"
                    placeholder="Enter your name"
                    required
                >

            </div>


            <div class="form-group">

                <label>Email</label>

                <input
                    type="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label>Rating</label>

                <select>

                    <option>Select rating</option>
                    <option>⭐⭐⭐⭐⭐ Excellent</option>
                    <option>⭐⭐⭐⭐ Very Good</option>
                    <option>⭐⭐⭐ Good</option>
                    <option>⭐⭐ Average</option>
                    <option>⭐ Poor</option>

                </select>

            </div>


            <div class="form-group">

                <label>Your Feedback</label>

                <textarea
                    rows="6"
                    placeholder="Write your feedback here..."
                ></textarea>

            </div>


            <button
                type="submit"
                class="btn-primary"
            >
                Submit Feedback
            </button>

        </form>

    </div>

</section>

</body>
</html>
